# DECoNet: YOLOv12n with WSConv and a training-only TGFA auxiliary head.
# Inference skips TGFA and the auxiliary head: 2.28M parameters, 5.67 GFLOPs at 640x640.

nc: 12
scale: n
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, WSCDownDual, [64]]                    # 0-P1/2
  - [-1, 1, WSCDownDual, [128]]                   # 1-P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]            # 2
  - [-1, 1, WSCDownDual, [256]]                   # 3-P3/8
  - [-1, 2, C3k2,  [512, False, 0.25]]            # 4
  - [-1, 1, WSCDownDual, [512]]                   # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]                # 6
  - [-1, 1, WSCDownDual, [1024]]                  # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]               # 8

head:
  # FPN top-down
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 9
  - [[-1, 6], 1, Concat, [1]]                      # 10
  - [-1, 2, A2C2f, [512, False, -1]]               # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 12
  - [[-1, 4], 1, Concat, [1]]                      # 13
  - [-1, 2, A2C2f, [256, False, -1]]               # 14   <-- P3 output

  # PAN bottom-up
  - [-1, 1, Conv, [256, 3, 2]]                     # 15
  - [[-1, 11], 1, Concat, [1]]                     # 16
  - [-1, 2, A2C2f, [512, False, -1]]               # 17   <-- P4 output

  - [-1, 1, Conv, [512, 3, 2]]                     # 18
  - [[-1, 8], 1, Concat, [1]]                      # 19
  - [-1, 2, C3k2, [1024, True]]                    # 20   <-- P5 output

  # Main Detect head plus training-only TGFA auxiliary branch
  - [[14, 17, 20], 1, DetectAuxTGFA, [nc]]         # 21
