# Replace this placeholder with the local augmented PVEL-AD root.
path: /path/to/augmented-PVEL-AD
train: train/images
val: val/images
test: test/images

# Optional per-split label directories. Change train for missing-label experiments,
# for example to labels_missing90. Validation and test annotations stay unchanged.
label_dirs:
  train: labels
  val: labels
  test: labels

names:
  0: crack
  1: finger
  2: black_core
  3: thick_line
  4: star_crack
  5: corner
  6: fragment
  7: scratch
  8: horizontal_dislocation
  9: vertical_dislocation
  10: printing_error
  11: short_circuit
